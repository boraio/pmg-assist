# One-minute check of which GPU a pmg-assist Job really uses (ADR 0005, Open).
# It prints the visibility variables, then holds 512 MiB on PyTorch's cuda:0
# and lists every GPU's memory, so the GPU that rose is the one in use.
#   kubectl apply -f infra/k8s/gpu-check.yaml
#   kubectl -n pmg-assist logs -f job/gpu-check
#   kubectl -n pmg-assist delete job gpu-check
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-check
  namespace: pmg-assist
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: gpu-check
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: zeru
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: check
          image: pytorch/pytorch:2.15.0-cuda13.4-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              echo "NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES-unset} CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES-unset}";
              echo "before:"; nvidia-smi --query-gpu=index,uuid,memory.used --format=csv,noheader;
              python3 -c "import subprocess, torch;
              x = torch.empty(512 * 1024**2, dtype=torch.uint8, device='cuda'); torch.cuda.synchronize();
              print('torch sees', torch.cuda.device_count(), 'GPU(s); while holding 512 MiB on cuda:0:');
              print(subprocess.run(['nvidia-smi', '--query-gpu=index,uuid,memory.used', '--format=csv,noheader'],
              capture_output=True, text=True).stdout)"
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 2Gi
              nvidia.com/gpu: 1
