# Embedding Job on zeru's free GPU (ADR 0005). Inputs and outputs live on the
# pmg-data volume (embed-data.yaml). It prints which GPU it was given first.
#   kubectl apply -f infra/k8s/embed-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: embed-bge-small
  namespace: pmg-assist
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: embed
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: zeru
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: embed
          image: ghcr.io/boraio/pmg-assist-embed:vectors-0.1
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - >-
              nvidia-smi --query-gpu=index,uuid,name,memory.used,memory.total --format=csv || true;
              exec python -m pmg_ingest.embed --index-dir /data/index=0.1 --device cuda --threads 4 --batch 64
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 8Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pmg-data
