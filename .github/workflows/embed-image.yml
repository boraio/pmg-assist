# Builds and pushes the GPU embedding image (ADR 0005) when its inputs change.
# GitHub-hosted runner: the ARC runners have no Docker daemon. Branch pushes get
# a tag named after the branch, so a Job can try an image before it is merged.
name: embed-image

on:
  push:
    paths:
      - ingest/Dockerfile.embed
      - ingest/pmg_ingest/**
      - .dockerignore
      - .github/workflows/embed-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the CUDA base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ingest/Dockerfile.embed
          push: true
          tags: |
            ghcr.io/boraio/pmg-assist-embed:${{ github.ref_name }}
            ghcr.io/boraio/pmg-assist-embed:sha-${{ github.sha }}
